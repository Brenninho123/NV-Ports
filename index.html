<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightmareVision Ports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08070c;
            --card-bg: rgba(18, 16, 26, 0.75);
            --accent-glow: #8a2be2;
            --accent-cyan: #00f0ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .logo-container {
            margin-bottom: 12px;
        }

        .logo-title {
            max-width: 100%;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.6));
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .download-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-glow), #4a00e0);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
            padding: 16px 24px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.35);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(138, 43, 226, 0.55);
            background: linear-gradient(135deg, #9d3bff, #5900ff);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .version {
            color: var(--accent-cyan);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Official Hub</span>
        
        <div class="logo-container">
            <img src="ui/NightmareVision.png" alt="NightmareVision Ports" class="logo-title">
        </div>

        <p class="description">Central repository for custom engine ports, builds, and scripts.</p>

        <div class="download-card">
            <a href="https://github.com/Brenninho123/NV-Ports/releases/tag/v0.0.1" target="_blank" rel="noopener noreferrer" class="download-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 16l4-5h-3V4h-2v7H8l4 5zm9 2H3v2h18v-2z"/>
                </svg>
                Download NV-Ports
            </a>
            
            <div class="meta-info">
                <span>Latest Release</span>
                <span class="version">v0.0.1</span>
            </div>
        </div>
    </div>

</body>
</html>
